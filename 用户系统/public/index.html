<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线棋类对战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar">
  <span class="logo">棋类对战</span>
  <div class="nav-links">
    <span onclick="showView('lobby')">大厅</span>
    <span onclick="showView('leaderboard')">排行榜</span>
    <span onclick="showView('profile')">个人主页</span>
    <span id="nav-notif" onclick="toggleNotifPanel()" style="position:relative">🔔<span id="notif-badge" style="display:none;position:absolute;top:-6px;right:-8px;background:#e74c3c;color:#fff;font-size:10px;padding:1px 4px;border-radius:8px">0</span></span>
    <span id="nav-dm" onclick="toggleDmPanel()" style="position:relative;cursor:pointer">📩<span id="dm-badge" style="display:none;position:absolute;top:-6px;right:-8px;background:#e74c3c;color:#fff;font-size:10px;padding:1px 4px;border-radius:8px">0</span></span>
    <span class="user-badge" id="nav-username"></span>
    <button id="theme-toggle" onclick="toggleTheme()"><span class="icon-sun">☀️</span><span class="icon-moon">🌙</span></button>
    <span onclick="logout()">退出</span>
  </div>
  <div id="notif-panel">
    <div style="padding:12px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:bold">站内消息</span>
      <span onclick="markAllRead()" style="font-size:12px;color:#5c9ded;cursor:pointer">全部已读</span>
    </div>
    <div id="notif-list"></div>
  </div>
  <div id="dm-panel">
    <div style="padding:12px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:bold">私信</span>
      <span onclick="openNewDmDialog()" style="font-size:12px;color:#5c9ded;cursor:pointer">+ 新建</span>
    </div>
    <div id="dm-list"></div>
  </div>
</div>

<div id="auth-view" class="view active">
  <div class="center-page">
    <div class="card">
      <div class="auth-tabs">
        <button class="active" id="tab-login" onclick="switchTab('login')">登录</button>
        <button id="tab-register" onclick="switchTab('register')">注册</button>
      </div>
      <div id="form-login">
        <input type="text" id="login-user" placeholder="用户名" maxlength="10">
        <input type="password" id="login-pw" placeholder="密码">
        <button onclick="doLogin()">登录</button>
      </div>
      <div id="form-register" style="display:none">
        <input type="text" id="reg-user" placeholder="用户名（2-10个字符）" maxlength="10">
        <input type="password" id="reg-pw" placeholder="密码（至少4位）">
        <input type="password" id="reg-pw2" placeholder="确认密码">
        <button onclick="doRegister()">注册</button>
      </div>
      <div class="error" id="auth-error"></div>
    </div>
  </div>
</div>

<div id="lobby-view" class="view">
  <div class="center-page">
    <div class="card lobby-card">
      <h2>在线棋类对战</h2>
      <div class="greeting" id="lobby-greeting"></div>
      <div class="game-select">
        <button class="selected" onclick="selectGame('gomoku',this)">五子棋</button>
        <button onclick="selectGame('go',this)">围棋</button>
        <button onclick="selectGame('chess',this)">中国象棋</button>
      </div>
      <div class="timer-select">
        <button onclick="selectTimer(0,this)" class="selected">不限时</button>
        <button onclick="selectTimer(300,this)">5分钟</button>
        <button onclick="selectTimer(600,this)">10分钟</button>
        <button onclick="selectTimer(1800,this)">30分钟</button>
      </div>
      <div class="mode-select">
        <button class="selected" onclick="selectMode('pvp',this)">人人对战</button>
        <button onclick="selectMode('pve',this)">人机对战</button>
      </div>
      <div id="ai-difficulty" style="display:none">
        <span>AI难度：</span>
        <button class="selected" onclick="selectDifficulty('easy',this)">简单</button>
        <button onclick="selectDifficulty('medium',this)">普通</button>
        <button onclick="selectDifficulty('hard',this)">困难</button>
      </div>
      <div id="forbidden-select" style="display:none">
        <span>禁手规则：</span>
        <button class="selected" onclick="selectForbidden(false,this)">无禁手</button>
        <button onclick="selectForbidden(true,this)">有禁手</button>
      </div>
      <input type="text" id="room-input" placeholder="输入房间号" value="default">
      <button onclick="joinRoom()">加入房间</button>
    </div>
  </div>
</div>

<div id="game-view" class="view">
  <div class="center-page">
    <div id="players-info">
      <span id="player-black" class="p-name p-black"></span>
      <span id="vs-text">VS</span>
      <span id="player-white" class="p-name p-white"></span>
    </div>
    <div id="timer-bar"><span class="timer-box" id="timer-p1">--:--</span><span class="timer-box" id="timer-p2">--:--</span></div>
    <div id="status"></div>
    <canvas id="canvas"></canvas>
    <div id="game-info">
      <span id="room-id" title="点击复制房间号"></span>
      <div id="game-btns">
        <button id="btn-pass" onclick="sendPass()" style="display:none">Pass</button>
        <button id="btn-undo" onclick="sendUndo()">悔棋</button>
        <button id="btn-draw" onclick="sendDraw()">求和</button>
        <button id="btn-resign" onclick="sendResign()">认输</button>
        <button id="btn-report" onclick="showReportDialog()" style="background:#5c2a2a;color:#e74c3c">举报</button>
        <button id="btn-restart" onclick="sendRestart()">再来一局</button>
        <button id="btn-back" onclick="backToLobby()">返回</button>
      </div>
    </div>
    <div id="chat-box">
      <div id="chat-msgs"></div>
      <div id="chat-row">
        <input id="chat-input" placeholder="输入消息..." maxlength="100">
        <button id="chat-send" onclick="sendChatMsg()">发送</button>
      </div>
    </div>
  </div>
</div>

<div id="profile-view" class="view"><div class="center-page"><div class="card profile-card" id="profile-content"></div></div></div>
<div id="leaderboard-view" class="view"><div class="center-page"><div class="card lb-card"><h2>排行榜</h2><div id="lb-content"></div></div></div></div>

<div id="choose-first">
  <div id="choose-box">
    <h2>选择先手</h2>
    <p>你要自己先下，还是让对方先下？</p>
    <div class="choose-btns">
      <button id="btn-self" onclick="chooseFirst(false)">自己先下</button>
      <button id="btn-opponent" onclick="chooseFirst(true)">让对方先下</button>
    </div>
  </div>
</div>

<div class="approval-dialog" id="undo-dialog">
  <div class="approval-box">
    <h3 id="undo-msg"></h3>
    <div class="btns">
      <button class="btn-approve" onclick="respondUndo(true)">同意</button>
      <button class="btn-reject" onclick="respondUndo(false)">拒绝</button>
    </div>
  </div>
</div>

<div class="approval-dialog" id="draw-dialog">
  <div class="approval-box">
    <h3 id="draw-msg"></h3>
    <div class="btns">
      <button class="btn-approve" onclick="respondDraw(true)">同意</button>
      <button class="btn-reject" onclick="respondDraw(false)">拒绝</button>
    </div>
  </div>
</div>

<!-- 私信对话弹窗 -->
<div id="dm-conversation-dialog" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center">
  <div style="background:#16213e;border-radius:12px;width:420px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:14px 18px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center">
      <span id="dm-conv-title" style="font-weight:bold;font-size:15px"></span>
      <span onclick="closeDmConversation()" style="cursor:pointer;font-size:20px;color:#888">×</span>
    </div>
    <div id="dm-conv-messages" style="flex:1;overflow-y:auto;padding:12px 16px"></div>
    <div style="padding:10px 14px;border-top:1px solid #222;display:flex;gap:8px">
      <input id="dm-conv-input" type="text" placeholder="输入消息..." maxlength="200" style="flex:1;padding:8px 12px;font-size:14px;border:1px solid #333;border-radius:6px;background:#1e2d4d;color:#fff;outline:none" onkeydown="if(event.key==='Enter')sendDmMsg()">
      <button onclick="sendDmMsg()" style="padding:8px 16px;background:#0f3460;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">发送</button>
    </div>
  </div>
</div>

<!-- 新建私信弹窗 -->
<div id="new-dm-dialog" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center">
  <div style="background:#16213e;border-radius:12px;padding:24px 28px;width:360px;text-align:center">
    <h3 style="margin-bottom:14px;font-size:18px">发送私信</h3>
    <input id="new-dm-to" type="text" placeholder="收件人用户名" maxlength="10" style="width:100%;padding:10px 12px;font-size:14px;border:1px solid #333;border-radius:6px;background:#1e2d4d;color:#fff;outline:none;margin-bottom:10px">
    <textarea id="new-dm-content" placeholder="消息内容" maxlength="500" style="width:100%;height:80px;padding:10px 12px;font-size:14px;border:1px solid #333;border-radius:6px;background:#1e2d4d;color:#fff;outline:none;resize:none;margin-bottom:14px"></textarea>
    <div style="display:flex;gap:10px">
      <button onclick="closeNewDmDialog()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#333;color:#fff;cursor:pointer;font-size:14px">取消</button>
      <button onclick="submitNewDm()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#0f3460;color:#fff;cursor:pointer;font-size:14px">发送</button>
    </div>
  </div>
</div>

<div id="report-dialog">
  <div style="background:#16213e;border-radius:12px;padding:28px 36px;text-align:center;width:380px;">
    <h2 style="margin-bottom:6px;font-size:20px">举报玩家</h2>
    <p id="report-target-name" style="color:#888;margin-bottom:16px;font-size:14px"></p>
    <div id="report-type-btns" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button data-type="boost" onclick="selectReportType(this)" style="padding:10px;border:2px solid #333;border-radius:8px;background:#0d1b3e;color:#ccc;cursor:pointer;font-size:13px">刷胜率/放水</button>
      <button data-type="cheat" onclick="selectReportType(this)" style="padding:10px;border:2px solid #333;border-radius:8px;background:#0d1b3e;color:#ccc;cursor:pointer;font-size:13px">使用外挂</button>
      <button data-type="abuse" onclick="selectReportType(this)" style="padding:10px;border:2px solid #333;border-radius:8px;background:#0d1b3e;color:#ccc;cursor:pointer;font-size:13px">恶意行为</button>
      <button data-type="other" onclick="selectReportType(this)" style="padding:10px;border:2px solid #333;border-radius:8px;background:#0d1b3e;color:#ccc;cursor:pointer;font-size:13px">其他</button>
    </div>
    <textarea id="report-detail" placeholder="补充说明（选填）" maxlength="200" style="width:100%;height:60px;padding:8px;font-size:13px;border:1px solid #5c9ded;border-radius:6px;background:#1e2d4d;color:#fff;outline:none;resize:none;margin-bottom:10px"></textarea>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button onclick="captureBoard()" style="flex:1;padding:8px;font-size:13px;border:1px solid #5c9ded;border-radius:6px;background:#1e2d4d;color:#5c9ded;cursor:pointer">自动截取棋盘</button>
      <label style="flex:1;padding:8px;font-size:13px;border:1px solid #5c9ded;border-radius:6px;background:#1e2d4d;color:#5c9ded;cursor:pointer;text-align:center">上传截图<input type="file" id="report-screenshot" accept="image/*" style="display:none" onchange="previewScreenshot(this)"></label>
    </div>
    <div id="screenshot-preview" style="text-align:center"></div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button onclick="closeReportDialog()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#333;color:#fff;cursor:pointer;font-size:14px">取消</button>
      <button onclick="submitReport()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#5c2a2a;color:#e74c3c;cursor:pointer;font-size:14px">提交举报</button>
    </div>
  </div>
</div>

<script src="game.js?v=3"></script>
<script src="game2.js?v=3"></script>
<script src="game3.js?v=3"></script>
</body>
</html>
