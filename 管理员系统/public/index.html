<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋管理后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #0f1923; color: #eee; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: #16213e; border-bottom: 1px solid #222; }
.header h1 { font-size: 18px; }
.header .nav { display: flex; gap: 16px; }
.header .nav span { cursor: pointer; color: #888; font-size: 14px; }
.header .nav span.active, .header .nav span:hover { color: #fff; }
.page { display: none; padding: 20px 24px; }
.page.active { display: block; }
.page h2 { margin-bottom: 16px; font-size: 20px; }

.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.room-card { background: #16213e; border-radius: 10px; padding: 16px; border: 1px solid #222; }
.room-card .room-title { font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.room-card .room-title .room-id { color: #5c9ded; }
.room-card .room-players { font-size: 13px; color: #aaa; margin-bottom: 10px; }
.room-card .room-players .p-black { color: #ddd; }
.room-card .room-players .p-white { color: #f0c040; }
.mini-board { display: grid; grid-template-columns: repeat(15, 1fr); gap: 1px; background: #0a1520; border-radius: 4px; padding: 2px; }
.mini-cell { width: 100%; aspect-ratio: 1; border-radius: 2px; }
.cell-empty { background: #c8a96e; }
.cell-black { background: #222; }
.cell-white { background: #eee; }
.mini-chess { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: #c8a96e; border-radius: 4px; padding: 4px; position: relative; }
.mc-cell { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; z-index: 1; position: relative; }
.mc-black { background: linear-gradient(135deg, #f5ead0, #d8c8a0); color: #2a3a28; border: 1.5px solid #8b7050; }
.mc-red { background: linear-gradient(135deg, #f5ead0, #d8c8a0); color: #c83830; border: 1.5px solid #8b7050; }
.mc-piece { font-family: "KaiTi","STKaiti","SimKai",serif; }
.mini-chess::before { content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; background-image: repeating-linear-gradient(0deg, transparent, transparent calc((100% - 8px) / 9 - 1px), #8b7050 calc((100% - 8px) / 9 - 1px), #8b7050 calc((100% - 8px) / 9)), repeating-linear-gradient(90deg, transparent, transparent calc(100% / 9 - 1px), #8b7050 calc(100% / 9 - 1px), #8b7050 calc(100% / 9)); pointer-events: none; z-index: 0; }
.mark-btns { display: flex; gap: 6px; margin-top: 10px; }
.mark-btns button { padding: 5px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
.mark-boost { background: #8b4513; }
.mark-cheat { background: #8b0000; }
.mark-abuse { background: #5c2a2a; }
.mark-btns button:hover { opacity: 0.8; }

.report-list { display: flex; flex-direction: column; gap: 10px; }
.report-card { background: #16213e; border-radius: 10px; padding: 16px; border: 1px solid #222; }
.report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.report-header .target { font-weight: bold; font-size: 16px; }
.report-header .time { font-size: 12px; color: #666; }
.report-body { font-size: 13px; color: #aaa; margin-bottom: 4px; }
.report-actions { display: flex; gap: 8px; margin-top: 10px; }
.report-actions button { padding: 6px 16px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; color: #fff; }
.btn-approve { background: #2ecc71; }
.btn-reject { background: #e74c3c; }
.report-actions button:hover { opacity: 0.8; }

.user-panel { background: #16213e; border-radius: 10px; padding: 20px; max-width: 600px; }
.user-panel input { width: 100%; padding: 10px 14px; font-size: 15px; border: 1px solid #5c9ded; border-radius: 6px; background: #1e2d4d; color: #fff; outline: none; margin-bottom: 12px; }
.user-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.user-info-box { background: #0d1b3e; border-radius: 8px; padding: 12px; text-align: center; }
.user-info-box .val { font-size: 22px; font-weight: bold; }
.user-info-box .label { font-size: 12px; color: #888; margin-top: 4px; }
.user-report-item { padding: 8px 12px; background: #0d1b3e; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
.empty-msg { text-align: center; color: #666; padding: 40px; }
.ban-badge { display: inline-block; padding: 3px 8px; background: #5c2a2a; color: #e74c3c; border-radius: 4px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>五子棋管理后台</h1>
  <div class="nav">
    <span class="active" data-page="rooms" onclick="showPage('rooms')">实时对局</span>
    <span data-page="reports" onclick="showPage('reports')">举报审核</span>
    <span data-page="appeals" onclick="showPage('appeals')">申诉审核</span>
    <span data-page="gamelog" onclick="showPage('gamelog')">对局记录</span>
    <span data-page="chatlog" onclick="showPage('chatlog')">聊天日志</span>
    <span data-page="user" onclick="showPage('user')">用户查询</span>
    <span data-page="admins" onclick="showPage('admins')">管理员</span>
    <span onclick="adminLogout()" style="color:#e74c3c;">退出</span>
  </div>
</div>

<div id="login-overlay" style="display:flex;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#16213e;border-radius:12px;padding:32px;width:360px;text-align:center;">
    <h2 style="margin-bottom:20px;">管理员登录</h2>
    <input type="text" id="admin-username" placeholder="用户名" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid #5c9ded;border-radius:6px;background:#1e2d4d;color:#fff;outline:none;margin-bottom:12px;">
    <input type="password" id="admin-password" placeholder="密码" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid #5c9ded;border-radius:6px;background:#1e2d4d;color:#fff;outline:none;margin-bottom:16px;">
    <button onclick="adminLogin()" style="width:100%;padding:12px;background:#0f3460;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px;">登录</button>
    <div id="login-error" style="color:#e74c3c;font-size:13px;margin-top:10px;"></div>
  </div>
</div>

<div id="page-rooms" class="page active">
  <h2>实时对局 <button onclick="refreshRooms()" style="margin-left:10px;padding:4px 12px;font-size:13px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">刷新</button></h2>
  <div id="rooms-content" class="room-grid"></div>
</div>

<div id="page-reports" class="page">
  <h2>待审核举报 <button onclick="refreshReports()" style="margin-left:10px;padding:4px 12px;font-size:13px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">刷新</button></h2>
  <div id="reports-content" class="report-list"></div>
</div>

<div id="page-appeals" class="page">
  <h2>待审核申诉 <button onclick="refreshAppeals()" style="margin-left:10px;padding:4px 12px;font-size:13px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">刷新</button></h2>
  <div id="appeals-content" class="report-list"></div>
</div>

<div id="page-gamelog" class="page">
  <h2>对局记录 <button onclick="refreshGameLog()" style="margin-left:10px;padding:4px 12px;font-size:13px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">刷新</button></h2>
  <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center;">
    <label style="color:#888;font-size:14px;">查询天数：</label>
    <select id="gamelog-days" style="padding:6px 10px;font-size:14px;background:#1e2d4d;color:#fff;border:1px solid #333;border-radius:4px;">
      <option value="1">1天</option>
      <option value="3">3天</option>
      <option value="7" selected>7天</option>
      <option value="14">14天</option>
      <option value="30">30天</option>
    </select>
  </div>
  <div id="gamelog-content" class="report-list"></div>
</div>

<div id="page-chatlog" class="page">
  <h2>聊天日志 <button onclick="refreshChatLog()" style="margin-left:10px;padding:4px 12px;font-size:13px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">刷新</button></h2>
  <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <label style="color:#888;font-size:14px;">查询天数：</label>
    <select id="chatlog-days" style="padding:6px 10px;font-size:14px;background:#1e2d4d;color:#fff;border:1px solid #333;border-radius:4px;">
      <option value="1">1天</option>
      <option value="3">3天</option>
      <option value="7" selected>7天</option>
      <option value="14">14天</option>
      <option value="15">15天</option>
    </select>
    <label style="color:#888;font-size:14px;">房间：</label>
    <input id="chatlog-room" placeholder="房间ID（可选）" style="padding:6px 10px;font-size:14px;background:#1e2d4d;color:#fff;border:1px solid #333;border-radius:4px;width:140px;">
    <label style="color:#888;font-size:14px;">用户：</label>
    <input id="chatlog-user" placeholder="用户名（可选）" style="padding:6px 10px;font-size:14px;background:#1e2d4d;color:#fff;border:1px solid #333;border-radius:4px;width:140px;">
    <button onclick="refreshChatLog()" style="padding:6px 14px;font-size:13px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">查询</button>
  </div>
  <div id="chatlog-content" class="report-list"></div>
</div>

<div id="page-user" class="page">
  <h2>用户查询</h2>
  <div class="user-panel">
    <input id="search-user" placeholder="输入用户名" onkeydown="if(event.key==='Enter')searchUser()">
    <button onclick="searchUser()" style="width:100%;padding:10px;background:#0f3460;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:16px;">查询</button>
    <div id="user-detail"></div>
  </div>
</div>

<div id="page-admins" class="page">
  <h2>管理员管理</h2>
  <div id="admin-no-permission" style="display:none;padding:20px;background:#16213e;border-radius:10px;border:1px solid #222;color:#888;text-align:center;">
    仅主管理员可以管理其他管理员
  </div>
  <div id="admin-manage-panel" style="display:none;">
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <div style="flex:1;min-width:300px;">
        <h3 style="margin-bottom:12px;font-size:16px;">添加管理员</h3>
        <div style="background:#16213e;border-radius:10px;padding:16px;border:1px solid #222;">
          <input id="new-admin-name" placeholder="输入用户名" style="width:100%;padding:10px 12px;font-size:14px;border:1px solid #5c9ded;border-radius:6px;background:#1e2d4d;color:#fff;outline:none;margin-bottom:12px;">
          <button onclick="addAdmin()" style="width:100%;padding:10px;background:#0f3460;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">添加管理员</button>
          <div id="admin-msg" style="color:#888;font-size:12px;margin-top:8px;"></div>
        </div>
      </div>
      <div style="flex:1;min-width:300px;">
        <h3 style="margin-bottom:12px;font-size:16px;">管理员列表</h3>
        <div id="admins-list" style="background:#16213e;border-radius:10px;padding:16px;border:1px solid #222;"></div>
      </div>
    </div>
  </div>
</div>

<script>
const reportTypeNames = { boost: '刷胜率/放水', cheat: '使用外挂', abuse: '恶意行为', other: '其他' };
let refreshTimer = null;

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.header .nav span').forEach(s => s.classList.remove('active'));
  const target = document.querySelector(`.header .nav span[data-page="${name}"]`);
  if (target) target.classList.add('active');
  if (name === 'rooms') refreshRooms();
  if (name === 'reports') refreshReports();
  if (name === 'appeals') refreshAppeals();
  if (name === 'gamelog') refreshGameLog();
  if (name === 'admins') refreshAdmins();
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  if (name === 'rooms') refreshTimer = setInterval(refreshRooms, 3000);
}

let adminKey = localStorage.getItem('admin_token') || '';
let isMainAdmin = localStorage.getItem('admin_is_main') === 'true';

async function adminLogin() {
  const username = document.getElementById('admin-username').value.trim();
  const password = document.getElementById('admin-password').value;
  if (!username || !password) { document.getElementById('login-error').textContent = '请输入用户名和密码'; return; }
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.error) { document.getElementById('login-error').textContent = data.error; return; }
    adminKey = data.token;
    isMainAdmin = data.isMain;
    localStorage.setItem('admin_token', data.token);
    localStorage.setItem('admin_user', data.username);
    localStorage.setItem('admin_is_main', data.isMain);
    document.getElementById('login-overlay').style.display = 'none';
    refreshRooms();
  } catch (e) { document.getElementById('login-error').textContent = '登录失败'; }
}

function adminLogout() {
  adminKey = '';
  isMainAdmin = false;
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_user');
  localStorage.removeItem('admin_is_main');
  location.reload();
}

// 检查是否已登录
if (!adminKey) {
  document.getElementById('login-overlay').style.display = 'flex';
} else {
  document.getElementById('login-overlay').style.display = 'none';
}

async function apiFetch(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'Authorization': 'Bearer ' + adminKey }, opts.headers || {});
  if (opts.method === 'POST') headers['Content-Type'] = 'application/json';
  opts.headers = headers;
  const res = await fetch(path, opts);
  const data = await res.json();
  if (res.status === 401 || res.status === 403) {
    adminKey = '';
    localStorage.removeItem('admin_token');
    localStorage.removeItem('admin_user');
    localStorage.removeItem('admin_is_main');
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('login-error').textContent = '登录已过期，请重新登录';
    throw new Error('认证失败');
  }
  return data;
}

async function refreshRooms() {
  const el = document.getElementById('rooms-content');
  try {
    const rooms = await apiFetch('/api/rooms');
    if (!rooms.length) { el.innerHTML = '<div class="empty-msg">当前没有进行中的对局</div>'; return; }
    const gameTypeNames = { gomoku: '五子棋', go: '围棋', chess: '中国象棋' };
    el.innerHTML = rooms.map(r => {
      let miniHtml = '';
      if (r.gameType === 'chess') {
        const ch = {K:'將',A:'士',B:'象',N:'馬',R:'車',C:'砲',P:'卒',k:'帥',a:'仕',b:'相',n:'馬',r:'車',c:'炮',p:'兵'};
        const cid = 'mc_' + r.id.replace(/[^a-zA-Z0-9]/g,'');
        miniHtml = `<canvas id="${cid}" width="306" height="340" style="border-radius:4px"></canvas>`;
        setTimeout(() => {
          const cv = document.getElementById(cid);
          if (!cv) return;
          const cx = cv.getContext('2d');
          const cw = 34, ch2 = 34, ox = 17, oy = 17;
          cx.fillStyle = '#c8a96e'; cx.fillRect(0, 0, 306, 340);
          cx.strokeStyle = '#8b7050'; cx.lineWidth = 1;
          for (let i = 0; i < 10; i++) { cx.beginPath(); cx.moveTo(ox, oy + i * ch2); cx.lineTo(ox + 8 * cw, oy + i * ch2); cx.stroke(); }
          for (let i = 0; i < 9; i++) {
            if (i === 0 || i === 8) { cx.beginPath(); cx.moveTo(ox + i * cw, oy); cx.lineTo(ox + i * cw, oy + 9 * ch2); cx.stroke(); }
            else { cx.beginPath(); cx.moveTo(ox + i * cw, oy); cx.lineTo(ox + i * cw, oy + 4 * ch2); cx.stroke(); cx.beginPath(); cx.moveTo(ox + i * cw, oy + 5 * ch2); cx.lineTo(ox + i * cw, oy + 9 * ch2); cx.stroke(); }
          }
          cx.beginPath(); cx.moveTo(ox, oy + 4 * ch2); cx.lineTo(ox + 8 * cw, oy + 5 * ch2); cx.stroke();
          cx.beginPath(); cx.moveTo(ox + 8 * cw, oy + 4 * ch2); cx.lineTo(ox, oy + 5 * ch2); cx.stroke();
          cx.beginPath(); cx.moveTo(ox + 3 * cw, oy); cx.lineTo(ox + 5 * cw, oy + 2 * ch2); cx.stroke();
          cx.beginPath(); cx.moveTo(ox + 5 * cw, oy); cx.lineTo(ox + 3 * cw, oy + 2 * ch2); cx.stroke();
          cx.beginPath(); cx.moveTo(ox + 3 * cw, oy + 7 * ch2); cx.lineTo(ox + 5 * cw, oy + 9 * ch2); cx.stroke();
          cx.beginPath(); cx.moveTo(ox + 5 * cw, oy + 7 * ch2); cx.lineTo(ox + 3 * cw, oy + 9 * ch2); cx.stroke();
          for (let rr = 0; rr < 10; rr++) for (let cc = 0; cc < 9; cc++) {
            const p = r.board[rr] && r.board[rr][cc]; if (!p) continue;
            const x = ox + cc * cw, y = oy + rr * ch2, radius = 14;
            const isRed = p === p.toLowerCase();
            cx.beginPath(); cx.arc(x, y, radius, 0, Math.PI * 2);
            const pg = cx.createRadialGradient(x - 2, y - 3, 1, x, y, radius);
            pg.addColorStop(0, '#f5ead0'); pg.addColorStop(1, '#d8c8a0');
            cx.fillStyle = pg; cx.fill();
            cx.strokeStyle = '#8b7050'; cx.lineWidth = 1.5; cx.stroke();
            cx.beginPath(); cx.arc(x, y, radius - 3, 0, Math.PI * 2);
            cx.strokeStyle = isRed ? '#c83830' : '#3a5a30'; cx.lineWidth = 1; cx.stroke();
            cx.fillStyle = isRed ? '#c83830' : '#2a3a28';
            cx.font = 'bold 12px "KaiTi","STKaiti",serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
            cx.fillText(ch[p] || p, x, y + 1);
          }
        }, 0);
      } else {
        const sz = r.size || (r.gameType === 'go' ? 19 : 15);
        const flat = r.board.flat();
        miniHtml = `<div class="mini-board" style="grid-template-columns:repeat(${Math.min(sz,19)},1fr)">${flat.map(v => `<div class="mini-cell ${v===0?'cell-empty':v===1?'cell-black':'cell-white'}"></div>`).join('')}</div>`;
      }
      const displayId = r.id.replace(/^[a-z]+_/, '');
      return `<div class="room-card">
        <div class="room-title">
          <span class="room-id">房间: ${displayId}</span>
          <span style="font-size:11px;padding:2px 6px;background:#0f3460;border-radius:4px;color:#aaa;">${gameTypeNames[r.gameType]||r.gameType}</span>
          <span style="font-size:12px;color:#888;">第${r.moveCount}手</span>
        </div>
        <div class="room-players"><span class="p-black">● ${r.names[1]}</span> VS <span class="p-white">○ ${r.names[2]}</span></div>
        ${miniHtml}
        <div class="mark-btns">
          <button class="mark-boost" onclick="markUser('${r.names[1]}','boost')">标记${r.names[1]}放水</button>
          <button class="mark-boost" onclick="markUser('${r.names[2]}','boost')">标记${r.names[2]}放水</button>
          <button class="mark-abuse" onclick="markUser('${r.names[1]}','cheat')">标记${r.names[1]}作弊</button>
          <button class="mark-abuse" onclick="markUser('${r.names[2]}','cheat')">标记${r.names[2]}作弊</button>
        </div>
      </div>`;
    }).join('');
  } catch { el.innerHTML = '<div class="empty-msg">无法连接游戏服务器</div>'; }
}

async function markUser(username, reason) {
  if (!confirm(`确定标记 ${username} 为${reportTypeNames[reason]}？`)) return;
  await apiFetch('/api/mark', { method: 'POST', body: JSON.stringify({ username, reason }) });
  alert('已标记');
  refreshRooms();
}

async function refreshGameLog() {
  const el = document.getElementById('gamelog-content');
  const days = document.getElementById('gamelog-days').value;
  try {
    const data = await apiFetch('/api/game-log?days=' + days);
    if (!data.games || !data.games.length) { el.innerHTML = '<div class="empty-msg">近' + days + '天暂无对局记录</div>'; return; }
    el.innerHTML = `<div style="margin-bottom:12px;color:#888;font-size:14px;">共 ${data.total} 场对局</div>` +
      data.games.map((g, idx) => {
        const time = new Date(g.time).toLocaleString('zh-CN');
        const winnerColor = g.winner === 1 ? '黑' : g.winner === 2 ? '白' : '平';
        const gameTypeName = { gomoku: '五子棋', go: '围棋', chess: '象棋' }[g.gameType] || g.gameType;
        return `<div style="padding:10px 14px;background:#16213e;border-radius:8px;margin-bottom:6px;border:1px solid #222;">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleGameDetail(${idx})">
            <span style="font-weight:bold;">${g.winner} ${winnerColor}胜</span>
            <span style="color:#888;font-size:12px;">[${gameTypeName}]</span>
            <span style="color:#666;font-size:12px;">${time}</span>
            <span id="arrow-${idx}" style="color:#5c9ded;font-size:14px;transition:transform 0.2s;">▶</span>
          </div>
          <div style="font-size:13px;color:#aaa;margin-top:4px;">${g.loser} 负 · ${g.totalMoves}手</div>

              <div style="display:flex;gap:8px;margin-top:8px;justify-content:center;">
                <button onclick="boardPrev(${idx})" style="padding:6px 16px;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;">◀ 上一步</button>
                <span id="move-info-${idx}" style="color:#aaa;font-size:13px;line-height:32px;">0/0</span>

            </div>

      }

function boardPrev(idx) {
  let step = (window['boardStep_' + idx] || 1) - 1;
  if (step < 0) step = 0;
  window['boardStep_' + idx] = step;
  drawReplayBoard(idx, step);
}

function boardNext(idx) {
  const g = gameData[idx];
  if (!g || !g.moves) return;
  let step = (window['boardStep_' + idx] || 0) + 1;
  if (step > g.moves.length) step = g.moves.length;
  window['boardStep_' + idx] = step;
  drawReplayBoard(idx, step);
}

function drawReplayBoard(idx, step) {
  const g = gameData[idx];
  if (!g) return;
  const canvas = document.getElementById('board-canvas-' + idx);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = g.gameType === 'chess' ? null : (g.gameType === 'go' ? 19 : 15);
  const cellSize = g.gameType === 'chess' ? 30 : (size === 19 ? 14 : 18);

  if (g.gameType === 'chess') {
    canvas.width = 306; canvas.height = 340;
    drawChessBoard(ctx, canvas.width, canvas.height);
    const board = initChessBoard();
    for (let i = 0; i < step && i < g.moves.length; i++) {
      const m = g.moves[i];
      if (m.fr !== undefined) {
        const piece = board[m.fr][m.fc];
        board[m.tr][m.tc] = piece;
        board[m.fr][m.fc] = '';
      }
    }
    drawChessPieces(ctx, board, 33, 33, 30);
    if (step > 0 && g.moves[step-1] && g.moves[step-1].tr !== undefined) {
      const m = g.moves[step-1];
      ctx.strokeStyle = '#f44'; ctx.lineWidth = 2;
      ctx.strokeRect(33 + m.tc * 30 - 2, 33 + m.tr * 30 - 2, 24, 24);
    }
  } else {
    const totalSize = cellSize * (size - 1) + 56;
    canvas.width = canvas.height = totalSize;
    ctx.fillStyle = '#c8a96e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#6b5230'; ctx.lineWidth = 1;
    for (let i = 0; i < size; i++) {
      ctx.beginPath(); ctx.moveTo(28, 28 + i * cellSize); ctx.lineTo(28 + (size-1) * cellSize, 28 + i * cellSize); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(28 + i * cellSize, 28); ctx.lineTo(28 + i * cellSize, 28 + (size-1) * cellSize); ctx.stroke();
    }
    const board = initBoard(size);
    let lastR = -1, lastC = -1;
    for (let i = 0; i < step && i < g.moves.length; i++) {
      const m = g.moves[i];
      if (m.r !== undefined && m.c !== undefined) {
        board[m.r][m.c] = m.color;
        lastR = m.r; lastC = m.c;
      }
    }
    const stoneR = cellSize * 0.43;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (board[r][c]) {
          const x = 28 + c * cellSize, y = 28 + r * cellSize;
          ctx.beginPath(); ctx.arc(x, y, stoneR, 0, Math.PI * 2);
          const g2 = ctx.createRadialGradient(x - stoneR * 0.2, y - stoneR * 0.2, stoneR * 0.1, x, y, stoneR);
          if (board[r][c] === 1) { g2.addColorStop(0, '#444'); g2.addColorStop(1, '#000'); }
          else { g2.addColorStop(0, '#fff'); g2.addColorStop(1, '#ccc'); }
          ctx.fillStyle = g2; ctx.fill();
        }
      }
    }
    if (lastR >= 0) {
      ctx.beginPath(); ctx.arc(28 + lastC * cellSize, 28 + lastR * cellSize, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#f44'; ctx.fill();
    }
  }
  const info = document.getElementById('move-info-' + idx);
  if (info) info.textContent = step + '/' + (g.moves ? g.moves.length : 0);
}

function initBoard(size) { return Array.from({ length: size }, () => Array(size).fill(0)); }
function initChessBoard() {
  const b = Array.from({ length: 10 }, () => Array(9).fill(''));
  b[0] = ['R','N','B','A','K','A','B','N','R'];
  b[2][1] = 'C'; b[2][7] = 'C';
  for (let c = 0; c < 9; c += 2) b[3][c] = 'P';
  b[9] = ['r','n','b','a','k','a','b','n','r'];
  b[7][1] = 'c'; b[7][7] = 'c';
  for (let c = 0; c < 9; c += 2) b[6][c] = 'p';
  return b;
}

function drawChessBoard(ctx, w, h) {
  const cw = 30, ox = 33, oy = 33;
  ctx.fillStyle = '#c8a96e'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#6b5230'; ctx.lineWidth = 1;
  // 横线
  for (let r = 0; r < 10; r++) {
    ctx.beginPath(); ctx.moveTo(ox, oy + r * cw); ctx.lineTo(ox + 8 * cw, oy + r * cw); ctx.stroke();
  }
  // 竖线（完整竖线）
  for (let c = 0; c < 9; c++) {
    if (c === 0 || c === 8) {
      ctx.beginPath(); ctx.moveTo(ox + c * cw, oy); ctx.lineTo(ox + c * cw, oy + 9 * cw); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(ox + c * cw, oy); ctx.lineTo(ox + c * cw, oy + 4 * cw); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox + c * cw, oy + 5 * cw); ctx.lineTo(ox + c * cw, oy + 9 * cw); ctx.stroke();
    }
  }
  // 九宫斜线
  ctx.beginPath(); ctx.moveTo(ox + 3 * cw, oy); ctx.lineTo(ox + 5 * cw, oy + 2 * cw); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox + 5 * cw, oy); ctx.lineTo(ox + 3 * cw, oy + 2 * cw); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox + 3 * cw, oy + 7 * cw); ctx.lineTo(ox + 5 * cw, oy + 9 * cw); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox + 5 * cw, oy + 7 * cw); ctx.lineTo(ox + 3 * cw, oy + 9 * cw); ctx.stroke();
  // 楚河汉界
  ctx.font = 'bold 14px "KaiTi","SimKai",serif';
  ctx.fillStyle = '#6b5230'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('楚 河', ox + 2 * cw, oy + 4.5 * cw);
  ctx.fillText('漢 界', ox + 6 * cw, oy + 4.5 * cw);
}

function drawChessPieces(ctx, board, ox, oy, cw) {
  const pieceNames = { K:'將',A:'士',B:'象',N:'馬',R:'車',C:'砲',P:'卒',k:'帥',a:'仕',b:'相',n:'馬',r:'車',c:'炮',p:'兵' };
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 9; c++) {
      const p = board[r][c];
      if (!p) continue;
      const x = ox + c * cw, y = oy + r * cw;
      const isRed = p === p.toLowerCase();
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2);
      ctx.fillStyle = '#f5ead0'; ctx.fill(); ctx.strokeStyle = '#8b7050'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = 'bold 15px "KaiTi","SimKai",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = isRed ? '#c83830' : '#2a3a28';
      ctx.fillText(pieceNames[p] || '', x, y);
    }
  }
}

function formatMoves(moves, gameType) {
  if (!moves || !moves.length) return '<div style="color:#666;">无棋谱记录</div>';
  const pieceNames = { K:'将',A:'士',B:'象',N:'马',R:'车',C:'炮',P:'卒',k:'帅',a:'仕',b:'相',n:'马',r:'车',c:'炮',p:'兵' };
  return '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
    '<tr style="color:#888;border-bottom:1px solid #333;"><th style="padding:4px;text-align:left;">#</th><th style="padding:4px;text-align:left;">棋手</th><th style="padding:4px;text-align:left;">走法</th></tr>' +
    moves.map((m, i) => {
      const color = m.color === 1 ? '黑' : '白';
      const colorStyle = m.color === 1 ? 'color:#ddd;' : 'color:#f0c040;';
      let moveStr = '';
      if (gameType === 'gomoku' || gameType === 'go') {
        moveStr = `(${m.r},${m.c})`;
      } else if (gameType === 'chess') {
        const piece = m.captured ? pieceNames[m.captured] || m.captured : '';
        moveStr = `(${m.fr},${m.fc})→(${m.tr},${m.tc})${piece ? '吃' + piece : ''}`;
      }
      if (m.type === 'pass') moveStr = 'Pass';
      return `<tr style="border-bottom:1px solid #222;"><td style="padding:4px;color:#666;">${i + 1}</td><td style="padding:4px;${colorStyle}">${color}</td><td style="padding:4px;">${moveStr}</td></tr>`;
    }).join('') +
    '</table>';
}
